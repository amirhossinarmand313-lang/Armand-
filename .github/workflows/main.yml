
name: Build Armand CCTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          unzip -q ArmandCCTV_Project_GitHub_Build-1.zip -d android-src

      - name: Build APK
        run: |
          WRAPPER=$(find android-src -name gradlew -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Collect APK
        run: |
          mkdir -p apk-output
          find android-src -path '*/build/outputs/apk/debug/*.apk' -exec cp {} apk-output/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Armand-CCTV-APK
          path: apk-output/*.apk
